<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day Souza · portfólio UGC</title>
<meta name="description" content="Day Souza, UGC creator de casa e decoração, comida, tech e pet. Vídeos com estratégia, roteiro e edição prontos pra anúncio.">

<!-- PRÉVIA DO LINK NO WHATSAPP: se o endereço do site mudar, troque nos 2 lugares abaixo -->
<meta property="og:title" content="Day Souza">
<meta property="og:description" content="Eu sou da Comunicação! Gosto de gente e amo fazer conexões e gerar identificação! Amo transmitir essa energia em todos os meus trabalhos.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ugc-aday.github.io/portfolio/">
<meta property="og:image" content="https://ugc-aday.github.io/portfolio/midia/capa.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Caveat:wght@600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --creme:#F6EEDC; --creme2:#FBF6EA; --amarelo:#F2B416; --vermelho:#E5482A; --preto:#151515; --cinza:#5D574C;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --serif:"Fraunces",Georgia,serif;
  --mao:"Caveat","Segoe Script",cursive;
  --texto:"Inter",system-ui,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font-family:var(--texto);font-size:15px;line-height:1.6;color:var(--preto);background:var(--creme);overflow-x:hidden;-webkit-font-smoothing:antialiased}
img,video,svg{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 32px}
section{position:relative}
.rotulo{font-family:var(--texto);font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--vermelho)}
h2{font-family:var(--serif);font-weight:700;font-size:clamp(30px,3.6vw,44px);line-height:1.08;letter-spacing:-.01em}
.mao{font-family:var(--mao);font-weight:700;color:var(--vermelho);font-size:1.18em;position:relative;white-space:nowrap;display:inline-block}
.mao svg{position:absolute;left:-2%;bottom:-.16em;width:104%;height:.3em;overflow:visible}

/* BOTÕES */
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border:2px solid var(--preto);transition:transform .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--preto)}
.btn:focus-visible,.aba:focus-visible,.vid:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid var(--vermelho);outline-offset:3px}
.b-amarelo{background:var(--amarelo);color:var(--preto)}
.b-preto{background:var(--preto);color:var(--creme2)}
.b-preto:hover{box-shadow:4px 4px 0 var(--vermelho)}
.b-contorno{background:transparent;color:var(--preto)}

/* LACUNAS LISTRADAS */
.lacuna{background:repeating-linear-gradient(135deg,#ecdfc2 0 14px,#f8f0de 14px 28px);color:var(--preto)}
.dica{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:18px;font-size:13px;line-height:1.4;font-weight:600;color:var(--preto)}
.dica svg{width:34px;height:34px;flex:none}
.dica small{font-size:12px;font-weight:500;color:var(--cinza);word-break:break-word}
.lacuna-txt{display:block;border:2px dashed var(--cinza);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--cinza);background:repeating-linear-gradient(135deg,#ecdfc2 0 14px,#f8f0de 14px 28px)}
.lacuna-txt b{color:var(--preto)}

/* MENU */
.menu{position:sticky;top:0;z-index:50;background:var(--creme);border-bottom:2px solid var(--preto)}
.menu .wrap{display:flex;align-items:center;gap:24px;height:64px}
.logo{font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:.02em;text-transform:uppercase;text-decoration:none;line-height:1;white-space:nowrap}
.logo i{font-style:normal;color:var(--vermelho);margin-left:4px}
.links{display:flex;gap:22px;margin-left:auto}
.links a{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;padding:6px 0;border-bottom:2px solid transparent}
.links a:hover{border-color:var(--vermelho)}
.menu .btn{padding:9px 16px;font-size:12px}
.menu-btn{display:none;margin-left:auto;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:2px solid var(--preto);border-radius:999px;padding:8px 14px}

/* CAPA */
.capa{padding:56px 0 72px}
.capa .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.nome{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(76px,12.5vw,176px);line-height:.84;letter-spacing:-.005em;margin:14px 0 0}
.nome span{display:block}
.pincelada{width:min(340px,70%);height:26px;margin:14px 0 20px}
.frase{font-size:16px;max-width:460px;color:var(--preto)}
.provas{display:flex;gap:28px;margin:22px 0 26px;flex-wrap:wrap}
.prova b{display:block;font-family:var(--display);font-weight:900;font-size:38px;line-height:1}
.prova span{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--cinza)}
.prova .vazio{display:inline-block;border:2px dashed var(--cinza);border-radius:8px;padding:0 10px;color:var(--cinza)}
.acoes{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.capa-esq{position:relative}
.selo{position:absolute;right:0;top:54px;width:132px;height:132px}
.gira{animation:gira 18s linear infinite;transform-origin:50% 50%}
@keyframes gira{to{transform:rotate(360deg)}}
.selo text,.selo-b text{font-family:var(--display);font-weight:900;letter-spacing:.06em}
.arte{position:relative;width:100%;max-width:440px;margin:0 auto;aspect-ratio:4/5}
.borrao{position:absolute;inset:-9% -11% -7% -11%;width:122%;height:116%;max-width:none}
.pontos{position:absolute;right:-5%;bottom:6%;width:96px;height:96px;background:radial-gradient(var(--preto) 2.4px,transparent 2.6px) 0 0/16px 16px}
.foto{position:absolute;inset:4% 6%;border:3px solid var(--preto);border-radius:16px;overflow:hidden;transform:rotate(1.6deg)}
.foto img,.sobre-foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.foto img{object-position:50% 60%}
.olho{position:absolute;left:-7%;top:3%;width:96px}
.risco{position:absolute;right:-6%;top:11%;width:120px}

/* SOBRE */
.sobre{background:var(--creme2);padding:80px 0;border-top:2px solid var(--preto)}
.sobre .wrap{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:center}
.sobre-arte{position:relative;max-width:420px;width:100%;margin:0 auto}
.sobre-foto{position:relative;aspect-ratio:4/5;border:3px solid var(--preto);overflow:hidden;margin-left:22px}
.faixa-v{position:absolute;left:0;top:8%;bottom:-5%;width:22px;background:var(--vermelho)}
.coroa{position:absolute;right:-18px;top:-46px;width:92px;transform:rotate(12deg)}
.sobre h2{margin:10px 0 18px}
.sobre-txt p{margin-bottom:12px;max-width:520px}
.sobre-fim{display:flex;align-items:center;gap:28px;margin-top:18px;flex-wrap:wrap}
.assinatura{font-family:var(--mao);font-weight:700;font-size:40px;line-height:1;transform:rotate(-4deg)}
.circulo{width:148px;height:148px;border-radius:50%;background:var(--amarelo);border:2px solid var(--preto);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:12px;font-weight:700;line-height:1.3;text-transform:uppercase;letter-spacing:.04em;transform:rotate(-9deg);flex:none}
.circulo i{font-style:normal;color:var(--vermelho);font-size:18px;line-height:1}

.faixa-preta{background:var(--preto);color:var(--creme2);padding:56px 0}
.faixa-preta h3{font-family:var(--serif);font-weight:700;font-size:clamp(24px,2.6vw,32px);margin-bottom:28px}
.difs{display:grid;grid-template-columns:repeat(3,1fr)}
.dif{padding:4px 28px;border-left:1px solid rgba(251,246,234,.3)}
.dif:first-child{padding-left:0;border-left:0}
.dif svg{width:34px;height:34px;color:var(--amarelo);margin-bottom:12px}
.dif h4{font-family:var(--serif);font-weight:700;font-size:20px;line-height:1.2;margin-bottom:6px}
.dif p{font-size:14px;color:#e6dfcf}
.numeros{display:flex;gap:48px;flex-wrap:wrap;margin-top:36px;padding-top:26px;border-top:1px solid rgba(251,246,234,.3)}
.numeros b{display:block;font-family:var(--display);font-weight:900;font-size:48px;line-height:1;color:var(--amarelo)}
.numeros span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.numeros .vazio{display:inline-block;border:2px dashed var(--amarelo);border-radius:8px;padding:0 12px}

/* FAIXA DE MARCAS ROLANDO */
.rolo{overflow:hidden;border-top:2px solid var(--preto);border-bottom:2px solid var(--preto);background:var(--creme);padding:14px 0}
.rolo-trilho{display:flex;width:max-content;animation:rola 42s linear infinite}
.rolo-grupo{display:flex;align-items:center;flex:none}
.rolo-grupo span{font-family:var(--display);font-weight:900;font-size:22px;text-transform:uppercase;letter-spacing:.04em;color:var(--cinza);padding:0 22px;white-space:nowrap;display:flex;align-items:center;gap:44px}
.rolo-grupo span::after{content:"✸";color:var(--vermelho);font-size:16px}
.rolo-grupo img{height:30px;width:auto;filter:grayscale(1)}
@keyframes rola{to{transform:translateX(-50%)}}

/* VÍDEOS */
.vid{position:relative;aspect-ratio:9/16;overflow:hidden;display:block;width:100%;border-radius:4px}
.vid video,.vid .yt-capa{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--preto)}
.vid .play{position:absolute;left:10px;bottom:10px;width:38px;height:38px;border-radius:50%;background:var(--amarelo);border:2px solid var(--preto);display:none;align-items:center;justify-content:center;font-size:13px;color:var(--preto);padding-left:3px}
.vid.ok{cursor:pointer}
.vid.ok .play{display:flex}
.vid.ok .dica{display:none}
.res{position:absolute;top:10px;left:10px;z-index:2;background:var(--amarelo);color:var(--preto);border:2px solid var(--preto);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;transform:rotate(-4deg)}

/* DESTAQUES */
.destaques{padding:84px 0}
.destaques .wrap{display:grid;grid-template-columns:270px 1fr;gap:44px;align-items:center}
.destaques h2{margin:10px 0 6px}
.onda{width:150px;height:18px;margin:10px 0 22px}
.destaques p{color:var(--cinza);margin-bottom:22px}
.dest-lista{display:grid;grid-template-columns:1.28fr 1fr 1fr;gap:22px;align-items:end}
.card .moldura{padding:10px;border-radius:8px}
.card:nth-child(3n+1) .moldura{background:var(--vermelho)}
.card:nth-child(3n+2) .moldura{background:var(--preto)}
.card:nth-child(3n) .moldura{background:var(--amarelo)}
.legenda{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-top:12px;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;line-height:1.3}
.sub{font-size:12px;color:var(--cinza);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.sub .falta{border:1px dashed var(--cinza);border-radius:6px;padding:0 6px}

/* NICHOS */
.nichos{background:var(--creme2);padding:84px 0;border-top:2px solid var(--preto)}
.nichos h2{margin:10px 0 26px}
.abas{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.aba{padding:10px 20px;border-radius:999px;border:2px solid var(--preto);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.aba[aria-selected="true"]{background:var(--amarelo)}
.nicho-grade{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.nicho-grade .vid{border:3px solid var(--preto);border-radius:8px}
.aviso{margin-top:18px;font-size:13px;color:var(--cinza);display:flex;gap:8px;align-items:center}
.aviso::before{content:"✸";color:var(--vermelho)}
.aviso[hidden]{display:none}

/* O QUE AS MARCAS FALAM */
.falam{background:var(--vermelho);color:#fff;padding:84px 0;overflow:hidden}
.falam-topo{display:flex;align-items:flex-start;gap:16px;margin-bottom:36px;position:relative}
.aspas{font-family:var(--serif);font-weight:700;font-size:120px;line-height:.75;color:var(--amarelo)}
.falam h2{color:#fff;padding-top:8px}
.selo-b{position:absolute;right:0;top:-18px;width:112px;height:112px}
.elogios{display:grid;grid-template-columns:repeat(3,1fr)}
.elogio{padding:6px 28px;border-left:1px solid rgba(255,255,255,.55);display:flex;flex-direction:column;gap:14px}
.elogio:first-child{padding-left:0;border-left:0}
.elogio blockquote{font-family:var(--serif);font-weight:500;font-size:19px;line-height:1.4}
.elogio b{font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:.04em;text-transform:uppercase;color:var(--preto);background:var(--amarelo);align-self:flex-start;padding:2px 10px;line-height:1.2}
.elogio span{font-size:13px;font-weight:500}
.elogio-vazio{min-height:170px;border:2px dashed #fff;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:18px;font-size:14px;font-weight:600;background:repeating-linear-gradient(135deg,rgba(21,21,21,.16) 0 14px,transparent 14px 28px)}
.elogio-vazio svg{width:30px;height:30px}
.atendidas{margin-top:44px;padding-top:26px;border-top:1px solid rgba(255,255,255,.55)}
.atendidas p{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px}
.atendidas ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px 28px}
.atendidas li{font-family:var(--display);font-weight:900;font-size:clamp(26px,3.2vw,38px);text-transform:uppercase;letter-spacing:.03em;line-height:1.1}

/* CONTATO */
.contato{padding:84px 0 0}
.contato h2{margin:10px 0 28px}
.duvidas{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-bottom:72px}
.duvida{border-top:3px solid var(--preto);padding-top:14px}
.duvida h3{font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.25;margin-bottom:8px}
.duvida p{font-size:14px;color:var(--cinza)}
.faixa-amarela{background:var(--amarelo);padding:72px 0;border-top:2px solid var(--preto);position:relative;overflow:hidden}
.faixa-amarela .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:start;position:relative}
.faixa-amarela h2{margin-bottom:26px;max-width:520px}
.faixa-amarela h2 .risca{position:relative;display:inline-block;white-space:nowrap}
.faixa-amarela h2 .risca svg{position:absolute;left:-2%;bottom:-.2em;width:104%;height:.3em;overflow:visible}
.explosao{width:150px;margin-top:34px}
.form{background:var(--creme2);border:2px solid var(--preto);border-radius:16px;padding:24px;box-shadow:6px 6px 0 var(--preto)}
.form h3{font-family:var(--serif);font-weight:700;font-size:22px;margin-bottom:14px}
.form label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.form input{display:block;width:100%;margin-top:4px;font:inherit;font-size:15px;font-weight:400;letter-spacing:0;text-transform:none;padding:10px 0;border:0;border-bottom:2px solid var(--preto);background:transparent;color:var(--preto);border-radius:0}
.form input:focus{outline:0;border-color:var(--vermelho)}
.form .gotcha{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.form .btn{margin-top:8px}
.form .erro{margin-top:14px;font-size:14px}
.form .erro .btn{margin-top:10px}
.recebi{font-family:var(--serif);font-weight:700;font-size:26px;line-height:1.2}

footer{background:var(--preto);color:var(--creme2);padding:30px 0 34px}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-right:96px}
footer .logo{color:var(--creme2)}
footer span{font-size:13px;letter-spacing:.06em}

/* BOTÃO FIXO DE WHATSAPP */
.zap{position:fixed;right:16px;bottom:16px;z-index:60;width:50px;height:50px;border-radius:50%;background:var(--preto);color:var(--amarelo);border:2px solid var(--amarelo);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(21,21,21,.3)}
.zap svg{width:26px;height:26px}

/* PLAYER GRANDE */
.player{position:fixed;inset:0;z-index:100;background:rgba(21,21,21,.92);display:none;align-items:center;justify-content:center;padding:20px}
.player.aberto{display:flex}
.player video,.player iframe{height:min(88vh,calc((100vw - 40px) * 16 / 9));aspect-ratio:9/16;max-width:100%;background:#000;border-radius:10px;border:3px solid var(--amarelo)}
.player [hidden]{display:none}
.player button{position:absolute;top:14px;right:14px;width:46px;height:46px;border-radius:50%;background:var(--amarelo);color:var(--preto);font-size:22px;font-weight:700;border:2px solid var(--preto)}

/* TELAS MÉDIAS */
@media (max-width:960px){
  .links{display:none;position:absolute;top:64px;left:0;right:0;background:var(--creme);border-bottom:2px solid var(--preto);flex-direction:column;gap:0;padding:6px 32px 14px}
  .links.aberto{display:flex}
  .links a{padding:12px 0;border-bottom:1px solid rgba(21,21,21,.15);font-size:13px}
  .menu-btn{display:block}
  .menu .wrap>.btn{display:none}
  .capa .wrap,.sobre .wrap,.destaques .wrap,.faixa-amarela .wrap{grid-template-columns:1fr}
  .capa .wrap{gap:56px}
  .nicho-grade{grid-template-columns:repeat(3,1fr)}
  .duvidas{grid-template-columns:repeat(2,1fr)}
  .selo{width:104px;height:104px}
}
/* CELULAR */
@media (max-width:520px){
  .wrap{padding:0 16px}
  .links{padding:6px 16px 14px}
  .capa{padding:32px 0 56px}
  .nome{font-size:clamp(68px,25vw,104px)}
  .selo{width:86px;height:86px;top:64px}
  .provas{gap:18px}
  .prova b{font-size:32px}
  .acoes .btn{width:100%;justify-content:center}
  .arte{max-width:300px}
  .olho{width:70px;left:-4%}.risco{width:84px;right:-3%}.pontos{right:-3%}
  .sobre,.destaques,.nichos,.falam{padding:56px 0}
  .contato{padding-top:56px}
  .sobre .wrap{gap:44px}
  .sobre-arte{max-width:300px}
  .coroa{width:70px;right:-6px;top:-36px}
  .difs,.elogios,.duvidas{grid-template-columns:1fr}
  .dif,.elogio{padding:20px 0 0;margin-top:20px;border-left:0;border-top:1px solid rgba(251,246,234,.3)}
  .elogio{border-top-color:rgba(255,255,255,.55)}
  .dif:first-child,.elogio:first-child{padding-top:0;margin-top:0;border-top:0}
  .numeros{gap:24px}
  .dest-lista{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 12px;align-items:flex-start;-webkit-overflow-scrolling:touch}
  .dest-lista .card{flex:0 0 74%;scroll-snap-align:center}
  .nicho-grade{grid-template-columns:repeat(2,1fr);gap:12px}
  .aspas{font-size:84px}
  .selo-b{width:78px;height:78px;top:-34px}
  .falam h2{padding-right:70px}
  .duvidas{margin-bottom:48px}
  .faixa-amarela{padding:52px 0}
  .explosao{width:110px}
  footer .wrap{padding-right:76px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rolo-trilho{width:auto;flex-wrap:wrap;justify-content:center}
  .rolo-grupo{flex-wrap:wrap;justify-content:center}
  .rolo-grupo[aria-hidden]{display:none}
}
</style>
</head>
<body>

<header class="menu"><div class="wrap" id="menu"></div></header>
<main>
  <section class="capa" id="capa"><div class="wrap" id="capa-conteudo"></div></section>
  <section class="sobre" id="sobre"><div class="wrap" id="sobre-conteudo"></div></section>
  <div class="faixa-preta"><div class="wrap" id="faixa-preta"></div></div>
  <div class="rolo" aria-label="Marcas atendidas"><div class="rolo-trilho" id="rolo"></div></div>

/* ---------- ajudantes ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(id){return document.getElementById(id);}
function slug(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}

function blocoFoto(src,alt,dica){

    +(src?'<img src="'+caminho(src)+'" alt="'+esc(alt)+'" onerror="this.remove()">':'');

/* pega o ID de um link do YouTube (shorts, watch ou youtu.be) */
function idYoutube(link){
  var m=String(link||'').match(/(?:youtube\.com\/(?:shorts\/|watch\?v=|embed\/)|youtu\.be\/)([\w-]{11})/i);
  return m?m[1]:'';
}
function blocoVideo(v,dica,primeiro){
  var arquivo=v.video||'';
  var yt=idYoutube(arquivo);
  var ehMp4=/\.mp4$/i.test(arquivo)&&!/^https?:\/\/(www\.)?(instagram|tiktok|drive\.google|vm\.tiktok)/i.test(arquivo);
  var h='<div class="vid lacuna" tabindex="0" role="button" data-video="'+esc(ehMp4?arquivo:'')+'" data-yt="'+esc(yt)+'" data-titulo="'+esc(v.titulo||yt||arquivo)+'" aria-label="'+esc('Abrir vídeo '+(v.titulo||''))+'">';
  if(v.res) h+='<span class="res">'+esc(v.res)+'</span>';
  h+='<div class="dica">'+ICO.video+'<span>'+esc(dica)+'</span><small>'+esc(ehMp4||yt?arquivo:(arquivo?'Link não toca aqui: falta o arquivo .mp4':'falta o arquivo .mp4'))+'</small></div>';
  if(yt){
    /* vídeo do YouTube: mostra a capa do vídeo e abre o player do YouTube ao clicar */
    h+='<img class="yt-capa" loading="lazy" alt="" src="'+esc(v.capa?caminho(v.capa):'https://i.ytimg.com/vi/'+yt+'/hqdefault.jpg')+'">';
  } else if(ehMp4){
    h+='<video muted playsinline preload="metadata"'+(primeiro&&!SEM_ANIMACAO?' autoplay loop data-auto="1"':'')
      +(v.capa?' poster="'+caminho(v.capa)+'"':'')+' src="'+caminho(arquivo)+'#t=0.1"></video>';
  }
  return h+'<span class="play" aria-hidden="true">▶</span></div>';
}
/* liga os vídeos de um trecho da página: lacuna se faltar, hover no computador, clique abre o player */
function ligarVideos(raiz,aoAssentar){
  var lista=raiz.querySelectorAll('.vid');
  Array.prototype.forEach.call(lista,function(caixa){
    var video=caixa.querySelector('video'), resolvido=false;
    function fim(ok){ if(resolvido) return; resolvido=true; if(ok) caixa.classList.add('ok'); else if(video){video.remove();video=null;} if(aoAssentar) aoAssentar(ok); }
    if(caixa.dataset.yt){ fim(true); }
    else if(!video){ fim(false); }
    else{
      video.addEventListener('loadedmetadata',function(){fim(true);});
      video.addEventListener('error',function(){fim(false);});
      if(video.readyState>=1) fim(true);
      if(video.dataset.auto&&'IntersectionObserver' in window){
        new IntersectionObserver(function(es){es.forEach(function(e){ if(!video) return; if(e.isIntersecting){var p=video.play(); if(p&&p.catch) p.catch(function(){});} else video.pause(); });},{threshold:.4}).observe(caixa);
      } else if(!video.dataset.auto&&TEM_MOUSE){
        caixa.addEventListener('mouseenter',function(){ if(video&&caixa.classList.contains('ok')){var p=video.play(); if(p&&p.catch) p.catch(function(){});} });
        caixa.addEventListener('mouseleave',function(){ if(video){video.pause();} });
      }
    }
    function abrir(){ if(caixa.classList.contains('ok')) abrirPlayer(caixa.dataset.video,caixa.dataset.titulo,caixa.dataset.yt); }
    caixa.addEventListener('click',abrir);
    caixa.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();abrir();} });
  });
}

/* ---------- player grande ---------- */
function abrirPlayer(arquivo,titulo,yt){
  var pv=$('player-video'), py=$('player-yt');
  if(yt){
    pv.hidden=true; py.hidden=false;
    py.src='https://www.youtube-nocookie.com/embed/'+yt+'?autoplay=1&playsinline=1&rel=0';
    $('player').classList.add('aberto');
  } else {
    py.hidden=true; pv.hidden=false;
    pv.src=caminho(arquivo); pv.muted=false;
    $('player').classList.add('aberto');
    var p=pv.play(); if(p&&p.catch) p.catch(function(){});
  }
  $('player-x').focus();
  /* métrica: qual vídeo foi aberto (só se o Umami existir) */
  try{ if(window.umami&&typeof window.umami.track==='function'){ window.umami.track(('video-'+slug(titulo)).slice(0,50).replace(/-+$/,'')); } }catch(e){}
}
function fecharPlayer(){
  var pv=$('player-video'); pv.pause(); pv.removeAttribute('src'); pv.load();
  var py=$('player-yt'); py.removeAttribute('src'); py.hidden=true;
  $('player').classList.remove('aberto');
}

/* ---------- métricas (Umami): só liga se DADOS.umami tiver o ID ---------- */
function ligarUmami(){
  if(!DADOS.umami) return;
  var s=document.createElement('script');
  s.src='https://cloud.umami.is/script.js';
  s.setAttribute('data-website-id',DADOS.umami);
  s.defer=true;
  document.head.appendChild(s);
}

/* ---------- link direto pro nicho: index.html?c=nome-do-nicho ---------- */
function abrirNichoDoLink(){
  var c='';
  try{ c=new URLSearchParams(location.search).get('c')||''; }catch(e){}
  if(!c) return;
  var alvo=slug(c), ns=DADOS.nichos||[];
  for(var i=0;i<ns.length;i++){
    if(slug(ns[i].nome)===alvo){
      abrirNicho(i);
      setTimeout(function(){ $('nichos').scrollIntoView({behavior:SEM_ANIMACAO?'auto':'smooth'}); },150);
      return;
    }
  }
}

function montar(){
  document.title=DADOS.nome+' · portfólio UGC';
  montarMenu(); montarCapa(); montarSobre(); montarRolo(); montarDestaques(); montarNichos(); montarFalam(); montarContato();
  $('player-x').addEventListener('click',fecharPlayer);
  $('player').addEventListener('click',function(e){ if(e.target===this) fecharPlayer(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&$('player').classList.contains('aberto')) fecharPlayer(); });
  ligarUmami();
  abrirNichoDoLink();
}
